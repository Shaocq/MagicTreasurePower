# 法宝之力 配置文件
# 修改后需要重新加载 mod（在 BBMM / 模组管理器里禁用再启用本 mod）才会生效。

# 扫描结果面板的重开热键。
# 取值是 Unity Input System 的按键名，例如：F8 / F7 / H / PageUp / Tab。
ScanHotkey=F8

# 是否允许「带路绿线」：在扫描面板里点箱子行时，从角色脚下画一条贴地绿线。
# 改成 false 后点箱子行不再画线（面板其它功能不受影响）。
ShowRouteLine=true

# 【测试用】是否把「火眼金睛」按 1 元上架到基地售货机。
# 正式发布前请改为 false，否则等于白送法宝。
ShopSellHuoYanJinJing=true
