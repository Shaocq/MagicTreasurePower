displayName = 法宝之力
description = 新增「法宝」类物品及其专属能力，七件法宝的能力均已实装。\n\n【法宝一览】\n· 翻天印：广成子镇洞之宝。祭出时迎风而长，如山岳倾压，寻常血肉之躯难挡一击。\n· 阴阳镜：赤精子之宝。镜分阴阳两面，白光照生、黑光定死，照定魂魄便由持镜人做主。\n· 定海珠：赵公明之宝，共二十四颗。祭起时碧海翻涛，宝珠化作流光，专打顶上三花。\n· 混元金斗：三霄娘娘之宝。金光一落，仙凡皆收，任你道行高深也难脱斗中之厄。\n· 金蛟剪：金蛟化剪，双龙交剪。祭在空中只一剪，利可分金断玉、剪断法宝灵光。\n· 九龙离火罩：九条火龙盘旋而成。罩落之处烈焰焚天，任你腾挪变化也难逃火网。\n· 火眼金睛：八卦炉中炼出的眼目，能看破虚妄、直抵本源。凡尘障眼之物，在它面前无处遁形。\n\n【法宝效果（Lv.7 满级）】\n· 翻天印：每次射击有 20% 概率不消耗弹药，并额外射出 3 发子弹（每发造成 100% 伤害）。\n· 阴阳镜：常驻减伤，最终承受的伤害降低 20%（乘算），且单次伤害最低为 1 点。\n· 定海珠：受到伤害时有 20% 概率完全免疫本次伤害；每场战局可免疫死亡 3 次，生命值锁定为 1 点并持续 5 秒，触发时清除自身全部异常状态且护体期间免疫异常状态，换图后次数重置。\n· 混元金斗：每次射击有 30% 概率，命中后额外造成「枪械基础伤害 × 1.5」的真实伤害。该伤害在本次伤害结算完成后单独生效，无视护甲、元素抗性、暴击与距离衰减。\n· 金蛟剪：每次射击有 30% 概率，命中敌人时随机移除自身一种异常状态的一层；自身没有异常状态时，获得一个随机增益（持续 8 秒，不同增益可共存，重复获得时时间累加）。\n· 九龙离火罩：装备时身体与头部护甲 +5，火、毒、电、空间、幽灵、冰六种元素抗性各 +20%，背包容量 +20 格。\n· 火眼金睛：进入战局时自动扫描全场物资箱与地上散落物品，按箱子分组列出其中价值最高的 N 件（Lv.1~7 = 1/1/2/2/3/4/5 件）；玩家 / 宠物身上与被搬运的容器、尸体掉落物不算，锁着且打不开的房间整间不展示；上锁的物资箱只有在已用钥匙录入机解锁或随身带着对应钥匙时才会被扫描。\n\n【通用规则】\n· 法宝必须装备在六个「法宝」槽位之一才生效；同一件法宝不能重复装备；法宝宝箱不可装备。\n· 装备在槽位里的法宝在角色死亡时不会掉落（与图腾一致）。\n· 法宝触发时会在屏幕中上方显示提示。\n· 火眼金睛的扫描结果是一个可关闭的列表面板：不暂停游戏，点空白处、关闭按钮或按 Esc 即可关掉。\n· 已经打开过的物资箱，会在列表标题后面标「已获取」并压暗名字。\n· 地上的散落物品会单独成组标为「地面掉落物」，同样能点行开启透视标记。\n· 点面板里的箱子行（或该箱任意物品行）会开启「透视标记」：箱子头顶挂火眼金睛图标，图标下方还有一个上下浮动的红色箭头；被墙挡住时箱子出现穿墙红边，能直接看到后红边消失、只留图标。选中后自动关掉面板，按热键可重新打开；再点同一行取消，走到 3 米内自动消失。\n\n【物品信息】\n· 七件法宝 ID 17350~17355 与 17357（17356 留给法宝宝箱），品质 7，基础价值 999999，重量 0.2。\n· 自定义物品 ID 段固定 17350~17399，由本 mod 独占。\n\n【法宝等级数值】\n· 法宝默认 1 级、上限 7 级；Lv.7 为当前正式数值，低等级按比例下调。\n· 翻天印：触发概率 8/10/12/14/16/18/20%；额外子弹 1/1/1/2/2/2/3 发；每发伤害 60/65/70/80/85/90/100%。\n· 阴阳镜：最终减伤 8/10/12/14/16/18/20%。\n· 定海珠：免伤概率 8/10/12/14/16/18/20%；免死次数 1/1/1/2/2/2/3 次；免死锁血全等级 5 秒。\n· 混元金斗：触发概率 12/15/18/21/24/27/30%；真实伤害倍率 1.0/1.1/1.2/1.2/1.3/1.4/1.5。\n· 金蛟剪：触发概率 12/15/18/21/24/27/30%；增益时长 4/5/5/6/6/7/8 秒。\n· 九龙离火罩：护甲 +2/+2/+3/+3/+4/+4/+5；元素抗性 8/10/12/14/16/18/20%；背包 +8/+10/+12/+14/+16/+18/+20。\n· 火眼金睛：扫描件数 1/1/2/2/3/4/5 件。\n· 升级经验：100/135/198/289/408/555（累计 1685）。\n· 击杀经验：普通敌人 +1、精英 +4、BOSS +9。\n\n【法宝任务与宝箱】\n· 在 Jeff 处可同时接取 8 个任务，完成各奖励 1 个「法宝宝箱」（不可堆叠，用一次少一个，可任选七件法宝之一）。\n· 法宝主要通过完成法宝任务获得，不再上架售货机。\n· 锋芒试炼：任意对局累计击杀 3 种不同的 BOSS 生物，并成功撤离。\n· 续航突围：本局开局不带备用弹药，击杀至少 7 名敌人并成功撤离。\n· 清浊除厄：单局内受到 3 种不同的异常状态（不含出血、骨折、创伤），无需带着异常撤离。\n· 濒死生还：单局血量降到 10% 以下至少 2 次，本局不阵亡并成功撤离。\n· 坚忍之守：单局累计承受伤害达到 400，活着成功撤离。\n· 满载而归：单局撤离带出的背包物资总价值达到 60 万，并成功撤离。\n· 初来乍到：成功从零号区撤离一次。\n· 明察秋毫：单局开启 10 个不同的物资箱，并成功撤离。\n\n【配置文件 config.ini】\n· 已接入 ModSetting（工坊 3595729494）：装了 ModSetting 时，可在游戏设置页的「模组设置」里改「呼出热键」与「透视标记」两项，改完立即生效；没装 ModSetting 时，改 mod 目录下的 config.ini（首次运行自动生成），改完禁用再启用本 mod 生效。\n· ScanHotkey=F8：呼出 / 关闭扫描面板的快捷键（Unity 按键名，例如 F8 / F7 / H / PageUp / Tab）；在游戏设置界面里按不会误触发。\n· ShowRouteLine=true：是否允许点箱子行开启「透视标记」；改 false 则只保留列表。
